<div class='bg-white rounded-lg shadow-lg p-4 mt-4'><div class='flex justify-between items-center gap-4'><div class='w-1/2'><input placeholder='Search customer' [(ngModel)]='search' class='form-control w-full' (keyup.enter)='searchCustomer()'/><div *ngIf='customer' class='mt-2 p-2 border rounded bg-gray-50'><div class='font-semibold text-gray-800'>{{customer.name}}</div><div class='text-sm text-gray-500'>{{customer.phone}}</div><div class='text-green-600 font-bold'>Balance: {{customer.balance | number:'1.0-0'}} Rs</div></div></div><div class='w-1/2'><input placeholder='Search product' [(ngModel)]='psearch' class='form-control w-full' (keyup.enter)='searchProduct()'/></div></div><div class='mt-6 overflow-x-auto'><table class='table-auto w-full text-left border'><thead class='bg-gray-100 text-gray-700'><tr><th class='px-2 py-1'>Product</th><th class='px-2 py-1'>Price</th><th class='px-2 py-1'>Qty</th><th class='px-2 py-1 text-right'>Total</th></tr></thead><tbody><tr *ngFor='let it of items' class='border-t'><td class='px-2 py-1'>{{it.name}}</td><td class='px-2 py-1'>{{it.price | number:'1.2-2'}}</td><td class='px-2 py-1'><input type='number' [(ngModel)]='it.qty' (change)='recalc()' class='form-control w-20 text-center'/></td><td class='px-2 py-1 text-right'>{{it.price * (it.qty || 0) | number:'1.2-2'}}</td></tr></tbody></table></div><div class='mt-6 flex justify-between items-center border-t pt-4'><div class='text-lg font-bold text-gray-800'>Total: {{total | number:'1.2-2'}}</div><div class='space-x-2'><button (click)='save()' class='btn btn-success'>Save</button><button (click)='syncNow()' class='btn btn-primary'>Sync Now</button></div></div></div>
