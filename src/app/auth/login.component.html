<div class='max-w-md mx-auto bg-white shadow-md rounded-lg p-6 mt-10'><h2 class='text-xl font-bold mb-4 text-gray-700 text-center'>Login</h2><div class='space-y-3'><input [(ngModel)]='username' placeholder='Username' class='form-control w-full'/><input [(ngModel)]='password' type='password' placeholder='Password' class='form-control w-full'/><button (click)='login()' class='btn btn-primary w-full'>Login</button><div *ngIf='message' class='text-center mt-2 text-red-600'>{{message}}</div></div></div>
