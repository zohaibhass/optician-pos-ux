<div class="login-container">
  <!-- Header Section -->
  <div class="login-header">
    <h1 class="login-title">Optician Dynamics</h1>
    <p class="login-subtitle">Sign in to your account</p>
  </div>

  <!-- Login Card -->
  <div class="login-card">
    <div class="form-header">
      <mat-icon class="header-icon" style="width: auto;     height: auto;">lock</mat-icon>
      <h2>Welcome Back</h2>
    </div>

    <!-- Username -->
    <div class="form-group">
      <label class="form-label">Username</label>
      <div class="input-group">
        <mat-icon class="input-icon">person</mat-icon>
        <input
          [(ngModel)]="username"
          placeholder="admin"
          class="form-input"
          type="text"
        />
      </div>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="input-group">
        <mat-icon class="input-icon">vpn_key</mat-icon>
        <input
          [(ngModel)]="password"
          type="password"
          placeholder="root"
          class="form-input"
        />
      </div>
    </div>

    <!-- Button -->
    <button (click)="login()" class="btn-login">
      <mat-icon class="btn-icon">login</mat-icon>
      Sign In
    </button>

    <!-- Message -->
    <div
      *ngIf="message"
      class="message-container"
      [class.success]="message.includes('Logged in')"
      [class.error]="message.includes('failed')"
    >
      <mat-icon class="message-icon">
        {{ message.includes('Logged in') ? 'check_circle' : 'error' }}
      </mat-icon>
      <span>{{ message }}</span>
    </div>
  </div>

  <!-- Footer -->
  <div class="login-footer">
    <p>
      Don't have an account?
      <a href="#" class="link">Contact administrator</a>
    </p>
  </div>
</div>
