@if (visible()) {
  <div class="modal-overlay">
    <div class="modal-card">

      <h2 class="modal-title">Checkout</h2>

      <div class="summary">
        <div class="summary-row">
          <span>Subtotal</span>
          <strong>{{ subtotal() | number:'1.3-3' }}</strong>
        </div>

        <div class="summary-row">
          <span>VAT</span>
          <strong>{{ vat() | number:'1.3-3' }}</strong>
        </div>

        <div class="summary-row total-row">
          <span>Total</span>
          <strong>{{ total() | number:'1.3-3' }}</strong>
        </div>
      </div>

      <div class="input-group">
        <label>Paid Amount</label>
        <input type="number" [(ngModel)]="paidAmount" class="input-box" placeholder="Enter amount" />
      </div>

      <div class="button-group">
        <button class="btn success" (click)="onConfirmPrint()">Confirm & Print</button>
        <button class="btn danger" (click)="onCancel()">Cancel</button>
      </div>

    </div>
  </div>
}
